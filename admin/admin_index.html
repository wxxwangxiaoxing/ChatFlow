<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · ChatFlow</title>
<!-- 设计 token 与用户端共用同一份，保证两端是一套视觉语言 -->
<link rel="stylesheet" href="../web/styles/tokens.css">
<link rel="stylesheet" href="styles/admin.css">
</head>
<body>

<h2 class="sr">ChatFlow 管理后台：数据看板、组织与成员、角色权限、群组管理、内容安全、审计日志、消息检索</h2>

<div class="adm">

  <!-- ================= 侧边栏 ================= -->
  <aside class="adm__side">
    <div class="adm__brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 18V9.5L12 4l8 5.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9.5 20v-5.5h5V20"/>
      </svg>
      <span>ChatFlow</span>
      <em>管理后台</em>
    </div>
    <nav class="adm-nav scroll" id="nav" aria-label="后台导航"></nav>
    <div class="adm__side-foot">
      <a class="adm-nav__item" href="../web/index.html" title="返回用户端">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
        <span>返回用户端</span>
      </a>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <div class="adm__main">

    <header class="adm__top">
      <div class="adm-crumb" id="crumb"></div>
      <span class="adm__top-spacer"></span>

      <label class="cf-input cf-input--search" title="全局搜索（⌘K）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input type="search" placeholder="搜索成员、群、日志" aria-label="全局搜索">
      </label>

      <button class="cf-btn cf-btn--ghost" id="themeBtn" data-theme-toggle title="切换主题" aria-label="切换主题" style="width:32px;padding:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>

      <button class="cf-btn cf-btn--ghost" data-act="topbar-bell" title="通知" aria-label="通知" style="width:32px;padding:0;position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.5a6 6 0 1 0-12 0V15l-1.5 2.5h15L18 15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
        </svg>
        <span class="cf-badge" style="position:absolute;top:2px;right:2px;transform:translate(40%,-30%)">3</span>
      </button>

      <button class="cf-btn cf-btn--ghost" data-act="topbar-help" title="帮助" aria-label="帮助" style="width:32px;padding:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4v.5"/>
          <circle cx="12" cy="17" r=".8" fill="currentColor"/>
        </svg>
      </button>

      <button class="adm-user" data-act="account-menu" title="账号">
        <span class="cf-avatar cf-avatar--28" style="background:var(--cf-blue-500)">陈</span>
        <span class="adm-user__body">
          <span class="adm-user__name">陈三</span>
          <span class="adm-user__role">组织管理员</span>
        </span>
      </button>
    </header>

    <main class="adm__content scroll" id="content" aria-label="页面内容"></main>
  </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<script src="scripts/admin.js"></script>
</body>
</html>
