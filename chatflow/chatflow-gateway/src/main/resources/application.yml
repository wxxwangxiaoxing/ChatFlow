spring:
  application:
    name: chatflow-gateway
  # 部署环境通过环境变量 SPRING_PROFILES_ACTIVE 覆盖（dev/test/staging/prod）
  profiles:
    active: dev

chatflow:
  env: dev

# 网关为纯 Netty 长连接服务，不使用 Tomcat。
# WSS 监听端口与 WebSocket 路径由 netty 启动配置读取：
#   websocket.path: /ws   websocket.port: 8000
chatflow-gateway:
  websocket:
    port: 8000
    path: /ws
  # 背压：单连接发送队列上限（架构文档 5.2）
  send-queue-limit: 256
  # 心跳：客户端 30s，超过 90s 判定离线（架构文档 5.2）
  heartbeat:
    interval-seconds: 30
    timeout-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
