<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · ChatFlow</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/auth.css">
</head>
<body>

<button class="cf-icon-btn auth-theme" data-theme-toggle title="切换主题"></button>

<div class="auth">


  <!-- ================= 表单 ================= -->
  <div class="auth__main">

    <div class="auth__mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 18V9.5L12 4l8 5.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9.5 20v-5.5h5V20"/>
      </svg>
      <span>ChatFlow</span>
    </div>

    <div class="auth-card">


      <div class="auth-head">
        <h2>登录</h2>
        <p>使用你的企业账号继续</p>
      </div>

      <!-- 登录方式切换 -->
      <div class="auth-tabs" role="tablist" aria-label="登录方式">
        <button type="button" role="tab" aria-selected="true"  data-login-tab="pw"  class="is-active">密码登录</button>
        <button type="button" role="tab" aria-selected="false" data-login-tab="sms">验证码登录</button>
        <button type="button" role="tab" aria-selected="false" data-login-tab="qr">扫码登录</button>
      </div>

      <!-- ---------- 密码登录 ---------- -->
      <form class="auth-form" data-auth-form="login" data-login-pane="pw" novalidate>
        <div class="field">
          <label class="field__label" for="account">账号 / 手机号</label>
          <div class="field__control">
            <span class="field__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
            </span>
            <input id="account" name="account" type="text" autocomplete="username"
                   placeholder="工号、账号或手机号" data-rule="account">
          </div>
          <div class="field__error" role="alert"></div>
        </div>

        <div class="field">
          <label class="field__label" for="loginPassword">密码</label>
          <div class="field__control">
            <span class="field__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10.5" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
            </span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password"
                   placeholder="请输入密码" data-rule="password">
            <span class="field__suffix">
              <button type="button" class="field__eye" data-toggle-pw="#loginPassword" aria-label="显示密码"></button>
            </span>
          </div>
          <div class="field__error" role="alert"></div>
        </div>

        <div class="row-between">
          <label class="check-row">
            <input type="checkbox" name="remember" checked>
            <span>7 天内自动登录</span>
          </label>
          <a class="link-quiet" href="forgot.html">忘记密码？</a>
        </div>

        <button type="submit" class="cf-btn cf-btn--primary cf-btn--block auth-submit">登录</button>
      </form>

      <!-- ---------- 验证码登录 ---------- -->
      <form class="auth-form" data-auth-form="login" data-login-pane="sms" novalidate hidden>
        <div class="field">
          <label class="field__label" for="phone">手机号</label>
          <div class="field__control">
            <span class="field__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
            </span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"
                   placeholder="请输入手机号" data-rule="phone">
          </div>
          <div class="field__error" role="alert"></div>
        </div>

        <div class="field">
          <label class="field__label" for="graphCode">图形验证码</label>
          <div class="field__control">
            <span class="field__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.2-2.9 8-7 9.5-4.1-1.5-7-5.3-7-9.5V6z"/></svg>
            </span>
            <input id="graphCode" name="graphCode" type="text" maxlength="4"
                   placeholder="不区分大小写" data-rule="captcha" data-captcha="#captchaBox">
            <span class="field__suffix">
              <button type="button" class="captcha" id="captchaBox" data-captcha-refresh
                      title="点击刷新" aria-label="图形验证码，点击刷新"></button>
            </span>
          </div>
          <div class="field__error" role="alert"></div>
        </div>

        <div class="field">
          <label class="field__label" for="smsCode">短信验证码</label>
          <div class="field__control">
            <span class="field__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
            </span>
            <input id="smsCode" name="smsCode" type="text" inputmode="numeric" maxlength="6"
                   placeholder="6 位数字" data-rule="code">
            <span class="field__suffix">
              <button type="button" class="field__btn" id="sendSmsCode">获取验证码</button>
            </span>
          </div>
          <div class="field__error" role="alert"></div>
        </div>

        <button type="submit" class="cf-btn cf-btn--primary cf-btn--block auth-submit">登录</button>
      </form>

      <!-- ---------- 扫码登录 ---------- -->
      <div data-login-pane="qr" hidden>
        <div class="qr-wrap">
          <div class="qr-box">
            <div id="qrCode"></div>
            <div class="qr-mask" id="qrMask">
              <span>二维码已失效</span>
              <button type="button" class="cf-btn cf-btn--secondary cf-btn--sm" data-qr-refresh>刷新二维码</button>
            </div>
          </div>
          <p class="qr-status" id="qrStatus"></p>
        </div>
        <button type="button" class="cf-btn cf-btn--secondary cf-btn--block" data-qr-simulate>
          原型演示：模拟扫码成功
        </button>
      </div>

      <div class="auth-divider">或</div>

      <button type="button" class="cf-btn cf-btn--secondary cf-btn--block" data-sso>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
          <path d="M12 3l7 3v5.5c0 4.2-2.9 8-7 9.5-4.1-1.5-7-5.3-7-9.5V6z"/><path d="M9.2 12l2 2 3.6-3.8"/>
        </svg>
        使用企业 SSO 登录
      </button>

      <div class="auth-foot">
        还没有账号？<a href="register.html">立即注册</a>
      </div>

    </div>
    <p class="auth__foot">V1.0.0 · 私有化部署 · 数据不出企业内网</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="scripts/auth.js"></script>
</body>
</html>
